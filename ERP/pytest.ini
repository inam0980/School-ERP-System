[pytest]
DJANGO_SETTINGS_MODULE = ERP.settings_test
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short --strict-markers
markers =
    unit: fast, isolated tests of a single function/model/form (auto-applied to tests/unit/)
    integration: tests that drive views/URLs/workflows through the Django test client (auto-applied to tests/integration/)
    regression: pins a bug that was found and fixed — must never be deleted
filterwarnings =
    ignore::DeprecationWarning:reportlab.*
    ignore::DeprecationWarning:xhtml2pdf.*
